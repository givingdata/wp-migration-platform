# Deploy the staff form (form/) to its Pages project when it changes, with config.js
# written from the repo's settings. scripts/deploy.sh does the first deploy and sets
# FORM_PROJECT; until then this workflow skips.
name: Deploy staff form

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - form/**
      - .github/workflows/deploy-form.yml

jobs:
  deploy:
    if: vars.FORM_PROJECT != '' && vars.WORKER_URL != ''
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: form-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # The API key ends up in the page, which is why the form must stay behind Cloudflare Access.
      - name: Build form
        env:
          SITE_NAME: ${{ vars.SITE_NAME }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          FORM_API_KEY: ${{ secrets.FORM_API_KEY }}
        run: |
          test -n "$FORM_API_KEY" || { echo "::error::FORM_API_KEY secret is missing"; exit 1; }
          mkdir -p form-dist
          cp form/index.html form/form-handler.js form/edit.js form/signing.js form-dist/
          node -e '
            const cfg = { siteName: process.env.SITE_NAME || "", workerUrl: process.env.WORKER_URL, apiKey: process.env.FORM_API_KEY, hmacSecret: null, designSpecs: null };
            require("fs").writeFileSync("form-dist/config.js", "// Generated by deploy-form.yml (contains the API key).\nexport default " + JSON.stringify(cfg, null, 2) + ";\n");
          '

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy form-dist --project-name=${{ vars.FORM_PROJECT }} --branch=main --commit-hash=${{ github.sha }}

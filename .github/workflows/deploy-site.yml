# Redeploy the site when its code, styles or design specs change.
name: Deploy Site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/**
      - lib/**
      - config/design-specs.json
      - config/theme.json
      - config/site.json
      - sections.json
      - redirects.csv
      - functions/**
      - package.json
      - package-lock.json
      - .github/workflows/deploy-site.yml
      - .github/workflows/_site.yml

jobs:
  site:
    # Only in client repos (scripts/deploy.sh sets this variable); the template never deploys.
    if: vars.CLOUDFLARE_PAGES_PROJECT != ''
    permissions:
      contents: read
      id-token: write # _site.yml reports the deploy to the Worker
    uses: ./.github/workflows/_site.yml
    with:
      reason: Site code updated
    secrets: inherit

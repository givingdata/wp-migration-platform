name = "wp-migration-worker"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"] # router mode: lets this Worker call the 1wp-slack router on workers.dev (otherwise 404)

[observability]
enabled = true

[vars]
SITE_NAME = "Your Organization"
GITHUB_REPO = "OWNER/CLIENT-site"
GITHUB_BRANCH = "main"
CONTENT_PATH = "content.json"
# Public base URL of the R2 bucket (custom domain or https://pub-xxxx.r2.dev)
R2_PUBLIC_URL = ""
# Comma-separated origins allowed to call the Worker (the form's host)
ALLOWED_ORIGINS = "http://localhost:8080"
# CLAUDE_MODEL = "claude-opus-5"
# Slack (optional, docs/SLACK.md). The bot only acts in these channels, for these staff.
# scripts/slack-add-client.mjs fills these in for the shared 1WP app (router mode).
# SLACK_CLIENT = ""
# SLACK_ROUTER_URL = ""
# SLACK_CHANNEL_IDS = ""
# SLACK_STAFF_EMAILS = ""
# SLACK_STAFF_DOMAINS = ""
# SLACK_HOURLY_LIMIT = "20"

# Secrets (set with `wrangler secret put <NAME>`, locally in .dev.vars):
#   API_KEY               shared with the form (Bearer token)
#   HMAC_SECRET           optional; defaults to API_KEY
#   ANTHROPIC_API_KEY     (or CLAUDE_API_KEY)
#   GITHUB_TOKEN          fine-grained token, Contents: read & write on GITHUB_REPO
#   SLACK_ROUTER_KEY      optional, from scripts/slack-add-client.mjs (shared 1WP app)
#   SLACK_SIGNING_SECRET  optional, only for a client's own Slack app (direct mode)
#   SLACK_BOT_TOKEN       optional, only for a client's own Slack app (direct mode)

[[kv_namespaces]]
binding = "CONTENT"
id = "REPLACE_WITH_KV_NAMESPACE_ID"   # scripts/deploy.sh fills this in

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "REPLACE_WITH_BUCKET_NAME"    # scripts/deploy.sh fills this in

[images]
binding = "IMAGES"

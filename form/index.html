<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Submit Content</title>
  <style>
    :root {
      --bg: #f6f5f2;
      --surface: #ffffff;
      --text: #1d1d1f;
      --muted: #5c5c63;
      --border: #cfcfd4;
      --accent: #6b2d5c;
      --accent-contrast: #ffffff;
      --focus: #1a5fb4;
      --error: #b3261e;
      --error-bg: #fdecea;
      --success: #1e6b35;
      --success-bg: #e7f4ea;
      --warn: #7a5200;
      --warn-bg: #fff4d6;
      --radius: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161618; --surface: #202023; --text: #f2f2f4; --muted: #b0b0b8; --border: #45454c;
        --accent: #d9a2ca; --accent-contrast: #1d1d1f; --focus: #8cb8ff;
        --error: #ffb4ab; --error-bg: #3b1714; --success: #9fd8ab; --success-bg: #14301c; --warn: #ffd98a; --warn-bg: #3a2c05;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 42rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
    header h1 { font-size: 1.75rem; margin: 0 0 .25rem; }
    header p { margin: 0 0 1.5rem; color: var(--muted); }
    header .eyebrow { margin: 0 0 .25rem; font-weight: 600; color: var(--accent); }
    header .eyebrow:empty { display: none; }
    form { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; }
    fieldset { border: 0; padding: 0; margin: 0 0 1.25rem; }
    legend, label { font-weight: 600; display: block; margin-bottom: .35rem; }
    .field { margin-bottom: 1.25rem; }
    .hint { color: var(--muted); font-size: .9rem; margin: .25rem 0 0; }
    .optional { font-weight: 400; color: var(--muted); }
    input[type="text"], input[type="date"], textarea {
      width: 100%; padding: .65rem .75rem; font: inherit; color: inherit;
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    }
    textarea { min-height: 10rem; resize: vertical; }
    input[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--error); border-width: 2px; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .types { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .5rem; }
    .types label {
      font-weight: 500; margin: 0; display: flex; gap: .5rem; align-items: center;
      padding: .7rem .8rem; border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
    }
    .types input { accent-color: var(--accent); width: 1.1rem; height: 1.1rem; }
    .types label:has(input:checked) { border-color: var(--accent); border-width: 2px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 34rem) { .row { grid-template-columns: 1fr; } }
    .error-text { color: var(--error); font-size: .9rem; margin: .3rem 0 0; }
    .error-text:empty { display: none; }
    .dropzone {
      border: 2px dashed var(--border); border-radius: var(--radius); padding: 1rem; text-align: center;
    }
    .dropzone.dragover { border-color: var(--accent); }
    .dropzone input[type="file"] { width: 100%; }
    .spec { background: var(--bg); border-radius: 8px; padding: .6rem .75rem; margin: .5rem 0 0; font-size: .9rem; }
    .preview { margin-top: 1rem; display: none; }
    .preview.visible { display: block; }
    .preview-grid { display: grid; grid-template-columns: 3fr 2fr; gap: 1rem; align-items: start; }
    @media (max-width: 34rem) { .preview-grid { grid-template-columns: 1fr; } }
    .crop-stage { position: relative; line-height: 0; border-radius: 6px; overflow: hidden; }
    .crop-stage img { width: 100%; height: auto; display: block; }
    .crop-box {
      position: absolute; border: 2px solid #fff; box-shadow: 0 0 0 9999px rgba(0,0,0,.45);
      outline: 1px solid rgba(0,0,0,.6); pointer-events: none;
    }
    .result-frame { width: 100%; overflow: hidden; border-radius: 6px; background: var(--bg); }
    .result-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
    figcaption { font-size: .85rem; color: var(--muted); margin-top: .35rem; line-height: 1.4; }
    .notice { border-radius: 8px; padding: .75rem 1rem; margin: 1rem 0 0; }
    .notice.warn { background: var(--warn-bg); color: var(--warn); }
    .actions { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
    button {
      font: inherit; font-weight: 600; padding: .75rem 1.5rem; border-radius: 8px; cursor: pointer;
      border: 2px solid var(--accent); background: var(--accent); color: var(--accent-contrast);
    }
    button.secondary { background: transparent; color: var(--accent); }
    button[disabled] { opacity: .6; cursor: progress; }
    .spinner {
      display: inline-block; width: 1em; height: 1em; margin-right: .5em; vertical-align: -.15em;
      border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
    #status { margin-top: 1.25rem; }
    #status:empty { display: none; }
    .status { border-radius: 8px; padding: 1rem; }
    .status.success { background: var(--success-bg); color: var(--success); }
    .status.error { background: var(--error-bg); color: var(--error); }
    .status ul { margin: .5rem 0 0; padding-left: 1.25rem; }
    .status a { color: inherit; }
    .visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow" id="site-name"></p>
      <h1>Submit Content</h1>
      <p>Add an exhibition, event or post to the website. It will be live within a few minutes.</p>
    </header>

    <form id="content-form" novalidate>
      <fieldset>
        <legend>What are you adding?</legend>
        <div class="types" id="type-options">
          <label><input type="radio" name="type" value="exhibition" required> Exhibition</label>
          <label><input type="radio" name="type" value="event"> Event</label>
          <label><input type="radio" name="type" value="post" checked> Post</label>
        </div>
        <p class="error-text" id="type-error" role="alert"></p>
      </fieldset>

      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required maxlength="200" autocomplete="off" aria-describedby="title-error">
        <p class="error-text" id="title-error"></p>
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" name="description" required maxlength="20000" aria-describedby="description-hint description-error"></textarea>
        <p class="hint" id="description-hint">Write it however is easiest — we'll tidy the formatting. Include any details visitors need (prices, links, who to contact).</p>
        <p class="error-text" id="description-error"></p>
      </div>

      <div class="row">
        <div class="field">
          <label for="date" id="date-label">Date</label>
          <input type="date" id="date" name="date" required aria-describedby="date-error">
          <p class="error-text" id="date-error"></p>
        </div>
        <div class="field" data-field="endDate" hidden>
          <label for="endDate">End date <span class="optional">(optional)</span></label>
          <input type="date" id="endDate" name="endDate" aria-describedby="endDate-error">
          <p class="error-text" id="endDate-error"></p>
        </div>
        <div class="field" data-field="time" hidden>
          <label for="time">Time <span class="optional">(optional)</span></label>
          <input type="text" id="time" name="time" placeholder="e.g. 6:00–9:00 pm" maxlength="200">
        </div>
      </div>

      <div class="field" data-field="location" hidden>
        <label for="location">Location <span class="optional">(optional)</span></label>
        <input type="text" id="location" name="location" maxlength="500" autocomplete="off">
      </div>

      <div class="field" data-field="author" hidden>
        <label for="author">Author <span class="optional">(optional)</span></label>
        <input type="text" id="author" name="author" maxlength="200" autocomplete="name">
      </div>

      <div class="field">
        <label for="image">Image <span class="optional">(optional)</span></label>
        <div class="dropzone" id="dropzone">
          <input type="file" id="image" name="image" accept="image/jpeg,image/png,image/webp" aria-describedby="image-spec image-error">
        </div>
        <p class="spec" id="image-spec">Loading image requirements…</p>
        <p class="error-text" id="image-error"></p>

        <div class="preview" id="preview" aria-live="polite">
          <div class="preview-grid">
            <figure style="margin:0">
              <div class="crop-stage" id="crop-stage">
                <img id="preview-original" alt="">
                <div class="crop-box" id="crop-box"></div>
              </div>
              <figcaption>Your image. The bright area is what the website will show; the darker edges are trimmed.</figcaption>
            </figure>
            <figure style="margin:0">
              <div class="result-frame" id="result-frame"><img id="preview-result" alt=""></div>
              <figcaption id="preview-caption">How it will appear on the site.</figcaption>
            </figure>
          </div>
          <div id="image-warnings"></div>
          <div class="actions" style="margin-top:.75rem">
            <button type="button" class="secondary" id="remove-image">Remove image</button>
          </div>
        </div>
      </div>

      <div class="actions">
        <button type="submit" id="submit-btn">Submit</button>
      </div>

      <div id="status" role="status" aria-live="polite" tabindex="-1"></div>
    </form>
  </main>

  <script type="module" src="form-handler.js"></script>
</body>
</html>
